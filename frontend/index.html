<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Formula 1 driver and constructor standings, race schedule and results. Fast, clean and ad-free."
    />
    <title>F1 Dashboard — Standings, Schedule &amp; Results</title>
    <script>
      // Applies the stored theme before React mounts. Without this the page
      // paints in light mode and then flips, which is both ugly and, for
      // light-sensitive users, genuinely unpleasant.
      ;(function () {
        try {
          var stored = localStorage.getItem('f1-theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* no stored preference available; React will resolve it on mount */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
