# Local development dependencies.
#
# Versions deliberately mirror production, verified against the live services:
# Neon reports PostgreSQL 18.4 (postgres:18-alpine gives exactly 18.4) and
# Upstash reports redis_version 8.2.0 (redis:8-alpine gives 8.8.1 — same major,
# which is as close as the official tags allow). Matching them locally means
# integration tests prove something about production rather than about
# Postgres-in-general.
#
# Re-check these when either provider upgrades — a silent drift here turns the
# Testcontainers suite into a test of the wrong database.
#
# Not used by the backend until F2 (resilience chain) — until then the API runs
# with no external dependencies at all.
services:
  postgres:
    image: postgres:18-alpine
    container_name: f1-postgres
    environment:
      POSTGRES_DB: f1dashboard
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1local
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # and expect the mount one level up, at /var/lib/postgresql. Mounting the
      # old /var/lib/postgresql/data path makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: f1-redis
    # No persistence: this is a cache, and treating it as disposable locally
    # keeps us honest about it being disposable in production.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
