# Local development dependencies.
#
# Versions deliberately mirror production: Neon runs Postgres 17, and Upstash is
# Redis 7 API-compatible. Matching them locally means integration tests prove
# something about production rather than about Postgres-in-general.
#
# Not used by the backend until F2 (resilience chain) — until then the API runs
# with no external dependencies at all.
services:
  postgres:
    image: postgres:17-alpine
    container_name: f1-postgres
    environment:
      POSTGRES_DB: f1dashboard
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: f1-redis
    # No persistence: this is a cache, and treating it as disposable locally
    # keeps us honest about it being disposable in production.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
