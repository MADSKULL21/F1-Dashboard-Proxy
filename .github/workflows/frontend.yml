name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  # Always run on PRs so required status checks on main are never skipped
  # by path filters (a backend-only PR would otherwise block forever).
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Separate from build so a type error is reported as a type error rather
      # than as a mysterious build failure.
      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
