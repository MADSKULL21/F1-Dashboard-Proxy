# Blocks a PR that introduces a dependency with a known vulnerability (PRD 5).
# Complements Dependabot: Dependabot fixes what is already in main, this stops
# new problems arriving.
name: dependency-review

on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
