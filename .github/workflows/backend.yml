name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs unit and integration tests. From F2 onwards these include
      # Testcontainers-backed Postgres and Redis; the ubuntu runner provides the
      # Docker daemon they need.
      - name: mvn verify
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: docker image & vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      # Proves the multi-stage build and the CDS training run still work — a
      # broken Dockerfile is a failed deploy, so it belongs in CI, not in Render.
      - name: Build image
        run: docker build -t f1-dashboard-api:${{ github.sha }} .

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: f1-dashboard-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
